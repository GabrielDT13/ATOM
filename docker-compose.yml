services:
  atom-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: atom-local
    ports:
      - "${ATOM_PORT:-8080}:5000"
    volumes:
      - ./:/app
    environment:
      - FLASK_ENV=development
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    restart: unless-stopped
