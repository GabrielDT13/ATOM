services:
  atom-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: atom-api
    ports:
      - "${ATOM_API_PORT:-8000}:8000"
    volumes:
      - ./:/app
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - BACKEND_RELOAD=${BACKEND_RELOAD:-true}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-in-production}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SUPABASE_URL=${SUPABASE_URL_INTERNAL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_AUD=${SUPABASE_JWT_AUD:-authenticated}
    restart: unless-stopped
  atom-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: atom-web
    depends_on:
      - atom-backend
    ports:
      - "${ATOM_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/backend-api}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://atom-backend:8000}
      - NEXT_PUBLIC_BACKEND_PUBLIC_ORIGIN=${NEXT_PUBLIC_BACKEND_PUBLIC_ORIGIN:-}
      - NEXT_PUBLIC_BACKEND_PUBLIC_PORT=${NEXT_PUBLIC_BACKEND_PUBLIC_PORT:-8000}
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next_cache:
