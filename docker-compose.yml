services:
  atom-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: atom-local
    ports:
      - "${ATOM_PORT:-8080}:5000"
    volumes:
      - ./:/app
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_HOST=${FLASK_HOST}
      - FLASK_PORT=${FLASK_PORT}
      - SUPABASE_URL=${SUPABASE_URL_INTERNAL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      supabase-kong:
        condition: service_healthy
    restart: unless-stopped

  supabase-db:
    image: postgres:15
    container_name: supabase-db
    ports:
      - "${SUPABASE_DB_PORT:-54322}:5432"
    environment:
      - POSTGRES_USER=${SUPABASE_DB_USER}
      - POSTGRES_DB=${SUPABASE_DB_NAME}
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supabase-auth:
    image: supabase/gotrue:v2.177.0
    container_name: supabase-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=${SUPABASE_API_EXTERNAL_URL}
      - GOTRUE_SITE_URL=${SUPABASE_SITE_URL}
      - GOTRUE_URI_ALLOW_LIST=*
      - GOTRUE_DISABLE_SIGNUP=${SUPABASE_DISABLE_SIGNUP}
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=${SUPABASE_JWT_AUD}
      - GOTRUE_JWT_EXP=${SUPABASE_JWT_EXP}
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SUPABASE_DB_PASSWORD}@supabase-db:5432/${SUPABASE_DB_NAME}?search_path=auth
      - GOTRUE_DB_NAMESPACE=auth
      - GOTRUE_DB_AUTOMIGRATE=true
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9999/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    container_name: supabase-rest
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SUPABASE_DB_PASSWORD}@supabase-db:5432/${SUPABASE_DB_NAME}
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_SERVER_PORT=3000
    healthcheck:
      test: ["CMD", "postgrest", "--help"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supabase-kong:
    image: kong:2.8.1
    container_name: supabase-kong
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_healthy
    ports:
      - "${SUPABASE_PORT:-54321}:8000"
    volumes:
      - ./supabase/kong/kong.yml:/home/kong/kong.yml:ro
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/home/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=off
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supabase-meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: supabase-meta
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_NAME=${SUPABASE_DB_NAME}
      - PG_META_DB_USER=${SUPABASE_DB_USER}
      - PG_META_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - PG_META_DB_SSL_MODE=disable
    restart: unless-stopped

  supabase-studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    depends_on:
      supabase-meta:
        condition: service_started
      supabase-kong:
        condition: service_healthy
    ports:
      - "${SUPABASE_STUDIO_PORT:-54323}:3000"
    environment:
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DEFAULT_ORGANIZATION_NAME=Local
      - DEFAULT_PROJECT_NAME=ATOM Local
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_PUBLIC_URL=http://127.0.0.1:${SUPABASE_PORT}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUTH_JWT_SECRET=${JWT_SECRET}
      - LOGFLARE_API_KEY=dev
      - LOGFLARE_URL=http://127.0.0.1
      - NEXT_PUBLIC_ENABLE_LOGS=false
    restart: unless-stopped

volumes:
  supabase-db-data:
