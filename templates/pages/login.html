{% extends 'base.html' %}

{% block body %}
<div class="login-page">
  <div class="login-box">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="login-error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <h2 class="login-title">Iniciar sesión</h2>

      <form method="POST" class="login-form">
        <div class="form-group">
          <input type="text" name="username" placeholder="Usuario" required>
        </div>
        <div class="form-group password-group">
          <input type="password" name="password" placeholder="Contraseña" required id="password">
          <img src="{{ url_for('static', filename='images/eye.png') }}" class="toggle-password" onclick="togglePassword()" alt="Mostrar contraseña">
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
  </div>
</div>
{% endblock %}
