<div class="edit-users-box">
    <h2>Editar Proyectos</h2>

    <table class="edit-users-table">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Proyecto</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for username, user_projects in projects.items() %}
                {% for project in user_projects %}
                <tr>
                    <td>{{ username }}</td>
                    <td>{{ project }}</td>
                    <td style="text-align:center;">
                        <a href="{{ url_for('edit_project_form', username=username, project_name=project) }}" class="btn-edit">Editar</a>
                        <form method="POST" action="{{ url_for('delete_project', username=username, project_name=project) }}" style="display:inline;">
                            <button type="submit" class="btn-delete">Borrar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            {% endfor %}
        </tbody>
    </table>
</div>
