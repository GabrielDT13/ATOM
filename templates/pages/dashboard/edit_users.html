<div class="edit-users-box">
    <h2>Editar Usuarios</h2>

    <table class="edit-users-table">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for username, info in users.items() %}
            <tr>
                <td>{{ username }}</td>
                <td>{{ info.email }}</td>
                <td>
                    <a href="{{ url_for('edit_user_form', username=username) }}" class="btn-edit">Editar</a>
                    <form method="POST"
                        action="{{ url_for('delete_user', username=username) }}"
                        onsubmit="return confirm('¿Eliminar usuario {{ username }}? Se borrará también su carpeta de proyectos (si existe).');"
                        style="display:inline;">
                        <button type="submit" class="btn-delete">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
