<div class="create-project-box">
    <h2>Editar Proyecto: {{ project_name }}</h2>

    <form method="POST" enctype="multipart/form-data" class="edit-project-form">
        <div class="form-group">
            <label for="project_name">Nombre del Proyecto</label>
            <input type="text" id="project_name" name="project_name" value="{{ project_name }}" required>
        </div>

        <div class="form-group">
            <label for="excel_file">Archivo Excel (opcional, reemplaza el existente)</label>
            <input type="file" id="excel_file" name="excel_file" accept=".xlsx,.xls">
        </div>

        <div class="form-group">
            <label for="additional_files">Archivos adicionales (opcional, reemplazan los existentes)</label>
            <input type="file" id="additional_files" name="additional_files" multiple>
        </div>

        {% if existing_files %}
        <div class="form-group">
            <label>Archivos actuales:</label>
            <ul>
                {% for file in existing_files %}
                    <li>{{ file }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <div class="form-actions" style="display: flex; gap: 10px;">
            <button type="submit" class="btn-action btn-submit">Guardar Cambios</button>
            <a href="{{ url_for('dashboard_edit_projects') }}" class="btn-action btn-cancel">Cancelar</a>
        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const buttons = document.querySelectorAll(".form-actions button, .form-actions a");

    if (buttons.length > 0) {
        let maxWidth = 0;
        let maxHeight = 0;

        // medir ancho y alto
        buttons.forEach(btn => {
            maxWidth = Math.max(maxWidth, btn.offsetWidth);
            maxHeight = Math.max(maxHeight, btn.offsetHeight);
        });

        // aplicar ancho y alto iguales
        buttons.forEach(btn => {
            btn.style.width = maxWidth + "px";
            btn.style.height = maxHeight + "px";
        });
    }
});
</script>
